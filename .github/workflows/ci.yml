name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Setup database
        run: |
          npx drizzle-kit push
          npx tsx src/db/seed.ts
      - name: Boundary check
        run: node scripts/check-boundaries.mjs
      - name: Conformance test
        run: npx tsx scripts/conformance.ts
      - name: Smoke upstreams
        run: npx tsx scripts/smoke-upstreams.ts
      - name: Auth test
        run: npx tsx scripts/test-auth.ts

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start app (embedded backend)
        run: |
          cp .env.example .env
          npx drizzle-kit push
          npx tsx src/db/seed.ts
          npm start > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "app did not become healthy"; tail -n 80 /tmp/app.log; exit 1
      - name: E2E smoke tests
        run: |
          trap 'echo "== app.log tail =="; tail -n 80 /tmp/app.log || true' ERR
          set -e
          check() { # $1=name $2=expected-substring $3..=curl args
            name="$1"; want="$2"; shift 2
            out=$(curl -sf "$@") || { echo "[$name] curl failed"; return 1; }
            echo "[$name] $(echo "$out" | head -c 200)"
            echo "$out" | grep -q "$want" || { echo "[$name] missing '$want'"; return 1; }
          }

          check health "ok" http://localhost:3000/api/health
          check models "vietscope-1" http://localhost:3000/v1/models
          check search '"results"' -X POST http://localhost:3000/v1/search \
            -H 'content-type: application/json' \
            -d '{"query":"quán giò chả ngon ở Yên Dũng"}'
          check places '"places"' "http://localhost:3000/v1/places/search?q=Y%C3%AAn%20D%C5%A9ng"
          check providers '"providers"' http://localhost:3000/v1/providers

          echo "✅ All E2E tests passed"
      - name: Cleanup
        if: always()
        run: pkill -f "next start" || true

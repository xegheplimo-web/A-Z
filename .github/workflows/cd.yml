name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'reports/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name for GHCR
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    # Gate: chỉ deploy khi repo variable DEPLOY_ENABLED=true VÀ DEPLOY_* secrets
    # đã được provision. Không có → job skip (build+push vẫn xanh), không còn
    # CD đỏ "missing server host" mỗi push main.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Lowercase repo name for GHCR
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/vietscope
            # Pin immutable SHA — deploy đúng artifact CI vừa build, không phải
            # :latest mơ hồ. Retag :latest để server compose dù tham chiếu
            # :latest vẫn nhận đúng image của release này.
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker tag ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker compose up -d --force-recreate app
            docker system prune -f

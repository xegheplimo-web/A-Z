services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RETRIEVAL_BACKEND=${RETRIEVAL_BACKEND:-embedded}
      - SEARCH_ROUTER_URL=${SEARCH_ROUTER_URL:-}
      - SEARCH_ROUTER_API_KEY=${SEARCH_ROUTER_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - VIETSCOPE_ADMIN_KEY=${VIETSCOPE_ADMIN_KEY:-}
      - VIETSCOPE_API_KEYS=${VIETSCOPE_API_KEYS:-}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

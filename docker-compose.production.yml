# Production Retrieval Gate overlay.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml \
#     --profile production up -d --build --wait
#
# The base compose remains the embedded dev/reference stack. This overlay makes
# search-router the only retrieval brain and wires its real infrastructure.
services:
  app:
    profiles: ["production"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      RETRIEVAL_BACKEND: search-router
      RETRIEVAL_FALLBACK: ""
      SEARCH_ROUTER_URL: http://search-router:8888
      SEARCH_ROUTER_API_KEY: ${SEARCH_ROUTER_API_KEY:-}
      SEARCH_ROUTER_TIMEOUT_MS: ${SEARCH_ROUTER_TIMEOUT_MS:-30000}
      VIETSCOPE_API_KEYS: ${VIETSCOPE_API_KEYS:-}
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      search-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app-migrate:
    profiles: ["production"]
    build: .
    command: ["npx", "drizzle-kit", "push"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  search-router:
    profiles: ["production"]
    build:
      context: ./services/search-router
    image: a-z/search-router:local
    environment:
      HUB_DATABASE_URL: postgresql://searchhub:searchhub@search-db:5432/searchhub
      POSTGRES_URL: postgresql://searchhub:searchhub@search-db:5432/searchhub
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
      OPENSEARCH_ENABLED: "true"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USE_SSL: "false"
      QDRANT_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
      QDRANT_GRPC_URL: http://qdrant:6334
      # Dense retrieval needs an embedding service/model and is deliberately
      # opt-in. Qdrant health/bootstrap is still covered by this stack.
      QDRANT_DENSE_ENABLED: ${QDRANT_DENSE_ENABLED:-false}
      PLACES_SERVING_ENABLED: "true"
      HYBRID_RETRIEVAL_ENABLED: "true"
      API_AUTH_ENABLED: "false"
      CRAWLER_ENABLED: "false"
      RERANKER_ENABLED: "false"
      RERANKER_SERVICE_ENABLED: "false"
      RERANKER_SERVICE_URL: ""
      EMBEDDING_SERVICE_ENABLED: "false"
      EMBEDDING_SERVICE_URL: ""
      EMBEDDING_MODEL: ""
      LLM_API_KEY: ""
      PROVIDER_SEARXNG_ENABLED: "true"
      PROVIDER_FIRECRAWL_ENABLED: "false"
      PROVIDER_DDGS_ENABLED: "false"
      PROVIDER_EXA_ENABLED: "false"
      PROVIDER_GITHUB_ENABLED: "false"
      PROVIDER_CODE_SEARCH_ENABLED: "false"
      PROVIDER_HN_ENABLED: "false"
      PROVIDER_ARXIV_ENABLED: "false"
      # Keep the P-NEXT gate deterministic: SearXNG is the only live-web
      # provider. Own corpus/OpenSearch remains a separate internal lane.
      PROVIDER_VNEXPRESS_ENABLED: "false"
      PROVIDER_TUOITRE_ENABLED: "false"
      PROVIDER_DANTRI_ENABLED: "false"
      PROVIDER_THANHNIEN_ENABLED: "false"
      PROVIDER_NHANDAN_ENABLED: "false"
      PROVIDER_VIETNAMPLUS_ENABLED: "false"
      PROVIDER_CONGTHUONG_ENABLED: "false"
      PROVIDER_GNEWS_VN_ENABLED: "false"
      PROVIDER_GNEWS_VN_GOV_ENABLED: "false"
      PROVIDER_GNEWS_VN_LEGAL_ENABLED: "false"
      PROVIDER_VN_GOLD_ENABLED: "false"
      PROVIDER_VN_FX_ENABLED: "false"
      PROVIDER_VN_STOCK_ENABLED: "false"
      JSON_LOGS: "true"
    depends_on:
      search-seed:
        condition: service_completed_successfully
      search-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    ports:
      # Direct core access for private operations and the production gate.
      # Bind to loopback so the unauthenticated internal service is not public.
      - "127.0.0.1:${SEARCH_ROUTER_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/v1/health >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  # One-shot admin-graph seed (P14). Runs migrations, then upserts the
  # bundled VN admin seed (units + aliases + relations + geometry) so the
  # retrieval brain can resolve locations and ingest can anchor records.
  # Idempotent — reruns update in place, never delete historical units.
  # Also in the data-ops profile: ingest/resolve/index need migrations +
  # the admin graph even when the production stack was never started.
  search-seed:
    profiles: ["production", "data-ops"]
    build:
      context: ./services/search-router
    image: a-z/search-router:local
    entrypoint:
      - sh
      - -c
      - 'python -m db.migrate --dsn "$$HUB_DATABASE_URL" && python -m db.seed_admin'
    environment:
      HUB_DATABASE_URL: postgresql://searchhub:searchhub@search-db:5432/searchhub
    depends_on:
      search-db:
        condition: service_healthy
    restart: "no"

  # Data-ops shell (P-DATA-1). Not part of the production profile — invoke
  # explicitly to run the staged pipeline inside the built image:
  #   docker compose -f docker-compose.yml -f docker-compose.production.yml \
  #     --profile data-ops run --rm data-ops -m scripts.ingest \
  #     --provider osm --file /data/vietnam-latest.osm.pbf
  # Host downloads land in ./data (gitignored); the container sees /data.
  data-ops:
    profiles: ["data-ops"]
    build:
      context: ./services/search-router
    image: a-z/search-router:local
    entrypoint: ["python"]
    command: ["-m", "scripts.ingest", "--help"]
    environment:
      HUB_DATABASE_URL: postgresql://searchhub:searchhub@search-db:5432/searchhub
      POSTGRES_URL: postgresql://searchhub:searchhub@search-db:5432/searchhub
      OPENSEARCH_ENABLED: "true"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${PILOT_DATA_DIR:-./data}:/data
    depends_on:
      search-seed:
        condition: service_completed_successfully
      search-db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: "no"

  # Also in the data-ops profile: ingest/resolve/index runs need it
  # without booting the full production profile.
  search-db:
    profiles: ["production", "data-ops"]
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: searchhub
      POSTGRES_PASSWORD: searchhub
      POSTGRES_DB: searchhub
    volumes:
      - search_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchhub -d searchhub"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    profiles: ["production"]
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  opensearch:
    profiles: ["production", "data-ops"]
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  qdrant:
    profiles: ["production"]
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  searxng:
    profiles: ["production"]
    image: searxng/searxng:2026.9.30-a9d990033
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_VALKEY_URL: redis://redis:6379/1
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  search_pgdata:
  redisdata:
  opensearchdata:
  qdrantdata:

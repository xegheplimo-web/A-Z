use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  # The service is private to the Compose network. Override in a real secret
  # manager when exposing SearXNG independently (VietScope does not).
  secret_key: "vietscope-compose-internal-change-me"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true
